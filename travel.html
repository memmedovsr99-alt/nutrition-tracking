<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Samir & Mina · Travel</title>
<meta name="theme-color" content="#eaf2ff" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky:#eaf3ff; --cream:#fff6ef;
    --ink:#2b2f4a; --ink2:#5a6180; --muted:#8a90ad;
    --card:#ffffff; --line:#e9edf7;
    --samir:#3a86ff; --samir-soft:#e3edff;
    --mina:#ff5d8f; --mina-soft:#ffe4ee;
    --sun:#ffb703; --teal:#1fc7a8; --coral:#ff7a59; --grape:#9b8cff;
    --ocean:#dcebff; --land:#e7ecf7; --land-visited:#ffe6c9; --land-line:#c9d4ea;
    --shadow:0 18px 40px -22px #4a5a9955;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 700px at 15% -10%, #dbebff 0%, transparent 55%),
      radial-gradient(1100px 700px at 100% 0%, #ffe6f0 0%, transparent 50%),
      linear-gradient(180deg,#f3f8ff 0%, #fff6ef 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 22px calc(60px + var(--safe-bottom)); }
  .display{ font-family:'Fredoka',sans-serif; }

  /* Header */
  header{ text-align:center; padding:44px 0 8px; }
  .kicker{ font-weight:800; letter-spacing:2px; text-transform:uppercase; font-size:.72rem; color:var(--muted); }
  h1{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(2.1rem,6vw,3.4rem); line-height:1.05; letter-spacing:-.5px; margin:6px 0; }
  h1 .plane{ display:inline-block; animation:fly 4s ease-in-out infinite; }
  @keyframes fly{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-8px) rotate(6deg);} }
  h1 .s{ color:var(--samir); } h1 .m{ color:var(--mina); }
  .tagline{ color:var(--ink2); font-weight:700; font-size:clamp(.95rem,2.5vw,1.15rem); }

  /* Tabs */
  .tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:26px 0 8px; }
  .tab{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:1rem; padding:11px 22px; border-radius:999px;
    background:#fff; border:2px solid var(--line); color:var(--ink2); cursor:pointer; transition:.18s;
    box-shadow:0 6px 16px -12px #4a5a9955;
  }
  .tab:hover{ transform:translateY(-1px); }
  .tab.active{ color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--samir),var(--grape)); box-shadow:0 12px 24px -12px var(--samir); }

  .view{ display:none; animation:fade .35s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }

  /* People bar */
  .people{ display:flex; gap:16px; justify-content:center; margin:24px 0 6px; flex-wrap:wrap; }
  .pill{
    display:flex; align-items:center; gap:12px; background:#fff; border:2px solid var(--line);
    border-radius:22px; padding:12px 18px 12px 12px; cursor:pointer; transition:.18s; box-shadow:var(--shadow); position:relative;
  }
  .pill:hover{ transform:translateY(-2px); }
  .pill.on{ border-color:transparent; }
  .pill.on[data-p="samir"]{ box-shadow:0 0 0 3px var(--samir), var(--shadow); }
  .pill.on[data-p="mina"]{ box-shadow:0 0 0 3px var(--mina), var(--shadow); }
  .av{ width:54px; height:54px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:1.7rem;
       background:var(--sky); overflow:hidden; border:3px solid #fff; box-shadow:0 4px 12px -4px #0003; }
  .av img{ width:100%; height:100%; object-fit:cover; }
  .pill .meta .nm{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.15rem; line-height:1; }
  .pill .meta .ct{ font-weight:800; font-size:.8rem; color:var(--muted); margin-top:3px; }
  .pill .edit{ position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%; background:#fff;
       border:2px solid var(--line); display:grid; place-items:center; font-size:.8rem; box-shadow:0 4px 10px -4px #0004; }
  .pill[data-p="samir"] .av{ box-shadow:0 0 0 3px var(--samir-soft); }
  .pill[data-p="mina"] .av{ box-shadow:0 0 0 3px var(--mina-soft); }

  .maphint{ text-align:center; color:var(--ink2); font-weight:700; font-size:.92rem; margin:6px 0 14px; }
  .maphint b{ color:var(--ink); }
  .maphint .who{ padding:2px 10px; border-radius:999px; background:var(--samir-soft); color:var(--samir); }

  /* Map */
  .mapcard{ background:var(--card); border:2px solid var(--line); border-radius:30px; padding:10px; box-shadow:var(--shadow); overflow:hidden; }
  .mapcard .inner{ border-radius:22px; overflow:hidden; background:var(--ocean); touch-action:none; position:relative; }
  #map{ display:block; width:100%; height:auto; }
  .country{ cursor:pointer; transition:fill .3s; }
  .avatar-g{ cursor:pointer; }
  .zoomctl{ position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; }
  .zoomctl button{ width:40px; height:40px; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:1.3rem;
       font-family:'Fredoka'; color:var(--ink2); cursor:pointer; box-shadow:0 6px 14px -8px #0005; display:grid; place-items:center; }
  .zoomctl button:active{ transform:scale(.94); }

  /* Legend cards */
  .legend{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px; }
  .lcard{ background:#fff; border:2px solid var(--line); border-radius:22px; padding:18px 14px; text-align:center; box-shadow:var(--shadow); }
  .lcard .n{ font-family:'Fredoka'; font-weight:700; font-size:2.4rem; line-height:1; }
  .lcard .l{ font-weight:800; font-size:.82rem; color:var(--ink2); margin-top:6px; }
  .lcard.samir .n{ color:var(--samir); } .lcard.mina .n{ color:var(--mina); } .lcard.both .n{ color:var(--coral); }

  .clist{ margin-top:22px; }
  .clist h3{ font-family:'Fredoka'; font-weight:600; font-size:1.15rem; margin-bottom:12px; text-align:center; }
  .chips{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .chip{ display:flex; align-items:center; gap:8px; background:#fff; border:2px solid var(--line); border-radius:999px;
       padding:6px 14px 6px 8px; font-weight:800; font-size:.9rem; box-shadow:0 6px 14px -12px #4a5a9955; }
  .chip .mini{ display:flex; }
  .chip .mini span{ width:22px; height:22px; border-radius:50%; background:var(--sky); display:grid; place-items:center; font-size:.85rem;
       overflow:hidden; border:2px solid #fff; margin-left:-8px; }
  .chip .mini span:first-child{ margin-left:0; }
  .chip .mini img{ width:100%; height:100%; object-fit:cover; }

  /* Year views */
  .yearhead{ text-align:center; margin:26px 0 4px; }
  .yearhead .yr{ font-family:'Fredoka'; font-weight:700; font-size:clamp(2.4rem,8vw,4rem); line-height:1;
       background:linear-gradient(135deg,var(--samir),var(--mina)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .yearhead .tog{ font-weight:800; color:var(--ink2); margin-top:4px; }
  .yearhead .tog b{ color:var(--ink); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px; }
  @media(max-width:720px){ .grid2{ grid-template-columns:1fr; } .legend{ gap:10px; } }

  .pcard{ background:#fff; border:2px solid var(--line); border-radius:26px; padding:22px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .pcard .ribbon{ position:absolute; inset:0 0 auto 0; height:8px; }
  .pcard.samir .ribbon{ background:linear-gradient(90deg,var(--samir),var(--grape)); }
  .pcard.mina .ribbon{ background:linear-gradient(90deg,var(--mina),var(--coral)); }
  .pcard .phead{ display:flex; align-items:center; gap:14px; margin:8px 0 18px; }
  .pcard .phead .av{ width:52px; height:52px; font-size:1.6rem; }
  .pcard .phead .nm{ font-family:'Fredoka'; font-weight:700; font-size:1.5rem; }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat{ background:var(--sky); border-radius:18px; padding:16px; }
  .stat.warm{ background:var(--cream); }
  .stat .v{ font-family:'Fredoka'; font-weight:700; font-size:1.7rem; line-height:1; }
  .stat .k{ font-weight:800; font-size:.74rem; color:var(--ink2); margin-top:7px; }
  .stat.wide{ grid-column:1/-1; }
  .stat .bar{ height:9px; border-radius:6px; background:#fff8; margin-top:11px; overflow:hidden; }
  .stat .bar i{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--sun),var(--coral)); }

  .flights{ margin-top:16px; }
  .frow{ display:flex; align-items:center; gap:12px; padding:12px 0; border-top:2px solid var(--line); }
  .frow:first-child{ border-top:none; }
  .frow .route{ font-weight:900; font-size:.95rem; }
  .frow .route .arw{ color:var(--muted); margin:0 4px; }
  .frow .mt{ font-size:.76rem; color:var(--muted); font-weight:700; margin-top:2px; }
  .frow .km{ margin-left:auto; font-family:'Fredoka'; font-weight:700; white-space:nowrap; }
  .frow .del{ border:none; background:none; color:var(--muted); font-size:1.1rem; cursor:pointer; padding:2px 4px; }
  .frow .del:active{ color:var(--mina); }
  .empty{ text-align:center; color:var(--muted); font-weight:800; padding:16px; }
  .addbtn{ width:100%; margin-top:16px; padding:15px; border-radius:16px; border:2px dashed var(--land-line); background:var(--sky);
       font-family:'Fredoka'; font-weight:600; font-size:1rem; color:var(--samir); cursor:pointer; transition:.15s; }
  .addbtn:hover{ background:var(--samir-soft); }
  .pcard.mina .addbtn{ color:var(--mina); background:var(--mina-soft); border-color:#f7c9d9; }

  /* Modal / sheet */
  .modal{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:18px; background:#2b2f4a55; backdrop-filter:blur(5px); }
  .modal.open{ display:flex; }
  .sheet{ width:100%; max-width:460px; background:#fff; border-radius:28px; padding:26px; box-shadow:0 40px 80px -30px #2b2f4a99; animation:pop .28s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes pop{ from{ transform:scale(.92); opacity:0;} to{ transform:none; opacity:1; } }
  .sheet h2{ font-family:'Fredoka'; font-weight:700; font-size:1.5rem; margin-bottom:18px; text-align:center; }
  .field{ margin-bottom:15px; }
  .field label{ display:block; font-weight:800; font-size:.78rem; color:var(--ink2); margin-bottom:7px; }
  .field input, .field select{ width:100%; padding:14px; border-radius:14px; border:2px solid var(--line); background:#fbfcff;
       font-family:'Nunito'; font-weight:700; font-size:1rem; color:var(--ink); }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--samir); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .seg{ display:flex; gap:10px; }
  .seg button{ flex:1; padding:13px; border-radius:14px; border:2px solid var(--line); background:#fbfcff; font-family:'Fredoka'; font-weight:600; font-size:1rem; color:var(--ink2); cursor:pointer; }
  .seg button.on[data-p="samir"]{ background:var(--samir-soft); color:var(--samir); border-color:var(--samir); }
  .seg button.on[data-p="mina"]{ background:var(--mina-soft); color:var(--mina); border-color:var(--mina); }
  .kmhint{ font-weight:800; color:var(--teal); font-size:.85rem; min-height:18px; margin-top:6px; }
  .emojis{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:6px 0 4px; }
  .emojis button{ width:46px; height:46px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:1.4rem; cursor:pointer; }
  .emojis button:hover{ border-color:var(--samir); transform:scale(1.08); }
  .actions{ display:flex; gap:12px; margin-top:10px; }
  .btn{ flex:1; padding:15px; border-radius:16px; border:none; font-family:'Fredoka'; font-weight:600; font-size:1.05rem; cursor:pointer; }
  .btn.ghost{ background:var(--sky); color:var(--ink2); }
  .btn.go{ background:linear-gradient(135deg,var(--samir),var(--mina)); color:#fff; }
  .uploadrow{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .uploadrow .prev{ width:70px; height:70px; border-radius:50%; background:var(--sky); display:grid; place-items:center; font-size:2rem; overflow:hidden; border:3px solid #fff; box-shadow:0 6px 16px -6px #0004; }
  .uploadrow .prev img{ width:100%; height:100%; object-fit:cover; }
  .filebtn{ padding:12px 16px; border-radius:14px; border:2px solid var(--line); background:#fbfcff; font-family:'Fredoka'; font-weight:600; color:var(--samir); cursor:pointer; }

  .banner{ background:#fff5e6; border:2px solid #ffd999; color:#8a5a12; border-radius:20px; padding:16px 18px; font-weight:700; margin:18px 0; text-align:center; line-height:1.5; }
  .banner b{ color:#5a3a08; }
  #toast{ position:fixed; left:50%; bottom:calc(28px + var(--safe-bottom)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
       padding:13px 22px; border-radius:999px; font-family:'Fredoka'; font-weight:600; opacity:0; transition:.25s; z-index:80; pointer-events:none; box-shadow:0 14px 30px -12px #0006; }
  #toast.show{ opacity:1; transform:translateX(-50%); }
  .confetti{ position:fixed; z-index:90; pointer-events:none; font-size:22px; }
  .loading{ text-align:center; padding:60px; color:var(--muted); font-family:'Fredoka'; font-size:1.1rem; }
</style>
</head>

<div class="wrap">
  <header>
    <div class="kicker">Our little world</div>
    <h1 class="display"><span class="s">Samir</span> <span class="plane">✈️</span> <span class="m">Mina</span></h1>
    <div class="tagline">Every country we've set foot in — and every mile we've flown ✨</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <!-- MAP -->
  <section class="view active" id="view-map">
    <div id="map-banner"></div>
    <div class="people" id="people"></div>
    <div class="maphint">Tap a country to drop <span class="who" id="hintWho">Samir</span>'s sticker · tap again to remove</div>
    <div class="mapcard">
      <div class="inner">
        <svg id="map"></svg>
        <div class="zoomctl">
          <button id="zin">＋</button><button id="zout">－</button>
        </div>
      </div>
    </div>
    <div class="legend">
      <div class="lcard samir"><div class="n" id="cSamir">0</div><div class="l" id="lSamir">Samir</div></div>
      <div class="lcard mina"><div class="n" id="cMina">0</div><div class="l" id="lMina">Mina</div></div>
      <div class="lcard both"><div class="n" id="cBoth">0</div><div class="l">Together 💞</div></div>
    </div>
    <div class="clist" id="clist"></div>
  </section>

  <div id="yearViews"></div>
</div>

<!-- Add flight -->
<div class="modal" id="flightModal">
  <div class="sheet">
    <h2>✈️ Add a flight</h2>
    <div class="field"><label>Who flew?</label><div class="seg" id="whoSeg"></div></div>
    <div class="two">
      <div class="field"><label>From</label><input id="fFrom" list="airports" placeholder="Baku or GYD" autocomplete="off"/></div>
      <div class="field"><label>To</label><input id="fTo" list="airports" placeholder="New York or JFK" autocomplete="off"/></div>
    </div>
    <datalist id="airports"></datalist>
    <div class="two">
      <div class="field"><label>Date</label><input id="fDate" type="date"/></div>
      <div class="field"><label>Distance (km)</label><input id="fKm" type="number" inputmode="numeric" placeholder="auto"/></div>
    </div>
    <div class="kmhint" id="kmHint"></div>
    <div class="actions"><button class="btn ghost" id="fCancel">Cancel</button><button class="btn go" id="fSave">Save flight</button></div>
  </div>
</div>

<!-- Edit avatar -->
<div class="modal" id="avatarModal">
  <div class="sheet">
    <h2 id="avTitle">Your sticker</h2>
    <div class="uploadrow">
      <div class="prev" id="avPrev">😎</div>
      <div>
        <label class="filebtn">📷 Upload photo<input id="avFile" type="file" accept="image/*" hidden/></label>
        <div style="font-size:.76rem;color:var(--muted);font-weight:700;margin-top:6px">This becomes your sticker on the map</div>
      </div>
    </div>
    <div class="field"><label>Or pick an emoji</label><div class="emojis" id="emojiGrid"></div></div>
    <div class="actions"><button class="btn ghost" id="avCancel">Close</button><button class="btn go" id="avSave">Save</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/d3.min.js"></script>

 MEL:['Melbourne',-37.67,144.84],AKL:['Auckland',-37.01,174.79],GRU:['Sao Paulo',-23.43,-46.47],
 EZE:['Buenos Aires',-34.82,-58.54],BOG:['Bogota',4.70,-74.15],MEX:['Mexico City',19.44,-99.07],
 CUN:['Cancun',21.04,-86.87],JNB:['Johannesburg',-26.13,28.24],CPT:['Cape Town',-33.97,18.60],
 NBO:['Nairobi',-1.32,36.93],CMN:['Casablanca',33.37,-7.59],KEF:['Reykjavik',63.99,-22.61],
 HEL:['Helsinki',60.32,24.96]
};
const NAME2CODE={}; Object.entries(AIRPORTS).forEach(([c,[n]])=>NAME2CODE[n.toLowerCase()]=c);
function resolveAirport(s){ if(!s) return null; s=s.trim(); const up=s.toUpperCase(); if(AIRPORTS[up])return AIRPORTS[up];
  const low=s.toLowerCase(); if(NAME2CODE[low])return AIRPORTS[NAME2CODE[low]];
  for(const[n,c]of Object.entries(NAME2CODE)){ if(n.startsWith(low)||low.startsWith(n))return AIRPORTS[c]; } return null; }
function haversine(a,b){ const R=6371,r=x=>x*Math.PI/180; const dLa=r(b[1]-a[1]),dLo=r(b[2]-a[2]);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a[1]))*Math.cos(r(b[1]))*Math.sin(dLo/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))); }

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
const nf=n=>Math.round(n).toLocaleString('en-US');
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function confetti(x,y){ const e=['✨','🎉','💫','⭐','🎈']; for(let i=0;i<16;i++){ const s=document.createElement('div'); s.className='confetti'; s.textContent=e[i%e.length]; s.style.left=x+'px'; s.style.top=y+'px'; document.body.appendChild(s);
  const a=Math.random()*6.28,d=50+Math.random()*100,dx=Math.cos(a)*d,dy=Math.sin(a)*d-50;
  s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.3) rotate(${(Math.random()*360)|0}deg)`,opacity:0}],{duration:800+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove(); } }
function avInner(p){ const P=PEOPLE[p]; return P.photo?`<img src="${P.photo}" alt=""/>`:P.emoji; }

/* ===== Map ===== */
let feats=[], pathGen, gMap, gAv, svgSel, zoomB, proj;
const rowsOf=id=>COUNTRIES.filter(c=>String(c.country_id)===String(id));
const setOf=p=>new Set(COUNTRIES.filter(c=>c.person===p).map(c=>String(c.country_id)));

async function initMap(){
  const W=980,Hh=520;
  svgSel=d3.select('#map').attr('viewBox',`0 0 ${W} ${Hh}`);
  let world;
  try{ world=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()); }
  catch(e){ document.querySelector('.inner').innerHTML='<div class="loading">Map couldn\'t load — check your connection.</div>'; return; }
  feats=topojson.feature(world,world.objects.countries).features.filter(f=>f.properties.name!=='Antarctica');
  proj=d3.geoNaturalEarth1().fitSize([W,Hh],{type:'FeatureCollection',features:feats});
  pathGen=d3.geoPath(proj);

  const defs=svgSel.append('defs');
  const sh=defs.append('filter').attr('id','avsh').attr('x','-40%').attr('y','-40%').attr('width','180%').attr('height','180%');
  sh.append('feDropShadow').attr('dx',0).attr('dy',1.4).attr('stdDeviation',1.4).attr('flood-color','#0006');

  svgSel.append('path').attr('d',pathGen({type:'Sphere'})).attr('fill','var(--ocean)');
  gMap=svgSel.append('g'); gAv=svgSel.append('g');
  gMap.selectAll('path.country').data(feats).enter().append('path')
    .attr('class','country').attr('d',pathGen).attr('id',d=>'c'+(d.id??d.properties.name))
    .attr('stroke','var(--land-line)').attr('stroke-width',.6)
    .on('click',(ev,d)=>onCountry(ev,d));

  zoomB=d3.zoom().scaleExtent([1,9]).on('zoom',ev=>{ gMap.attr('transform',ev.transform); gAv.attr('transform',ev.transform); sizeAvatars(ev.transform.k); });
  svgSel.call(zoomB).on('dblclick.zoom',null);
  $('#zin').onclick=()=>svgSel.transition().call(zoomB.scaleBy,1.6);
  $('#zout').onclick=()=>svgSel.transition().call(zoomB.scaleBy,.65);
  repaint();
}
function landFill(id){ return rowsOf(id).length ? 'var(--land-visited)' : 'var(--land)'; }
function repaint(){
  if(gMap) gMap.selectAll('path.country').attr('fill',d=>landFill(d.id??d.properties.name));
  drawAvatars(); renderLegend(); renderClist(); renderPeople();
}
function curK(){ try{ return d3.zoomTransform(svgSel.node()).k||1; }catch(e){ return 1; } }
function drawAvatars(){
  if(!gAv) return; gAv.selectAll('*').remove();
  const k=curK();
  feats.forEach(d=>{
    const id=String(d.id??d.properties.name); const rows=rowsOf(id); if(!rows.length) return;
    const c=pathGen.centroid(d); if(isNaN(c[0])) return;
    const hasS=rows.some(r=>r.person==='samir'), hasM=rows.some(r=>r.person==='mina');
    const list=[]; if(hasS)list.push('samir'); if(hasM)list.push('mina');
    const spread=list.length>1?9:0;
    list.forEach((p,i)=>{
      const dx=list.length>1?(i===0?-spread:spread):0;
      avatarNode(gAv, c[0]+dx, c[1], p, list.length>1);
    });
  });
  sizeAvatars(k);
}
function avatarNode(g,x,y,p,small){
  const P=PEOPLE[p]; const r=small?9:11;
  const node=g.append('g').attr('class','avatar-g').attr('data-x',x).attr('data-y',y).attr('data-r',r)
    .attr('transform',`translate(${x},${y})`).style('cursor','pointer')
    .on('click',ev=>{ ev.stopPropagation(); });
  const cid='clip'+Math.round(x*7+y*13)+p;
  node.append('circle').attr('r',r+2).attr('fill','#fff').attr('filter','url(#avsh)');
  node.append('circle').attr('r',r+2).attr('fill','none').attr('stroke',P.color).attr('stroke-width',2);
  if(P.photo){
    const clip=svgSel.select('defs').append('clipPath').attr('id',cid);
    clip.append('circle').attr('r',r);
    node.append('image').attr('href',P.photo).attr('x',-r).attr('y',-r).attr('width',r*2).attr('height',r*2)
      .attr('preserveAspectRatio','xMidYMid slice').attr('clip-path',`url(#${cid})`);
  }else{
    node.append('circle').attr('r',r).attr('fill','var(--sky)');
    node.append('text').attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size',r*1.15).text(P.emoji);
  }
}
function sizeAvatars(k){ if(!gAv) return; gAv.selectAll('.avatar-g').attr('transform',function(){ const x=+this.getAttribute('data-x'),y=+this.getAttribute('data-y'); return `translate(${x},${y}) scale(${1/k})`; }); }

async function onCountry(ev,d){
  if(tablesMissing){ toast('⚙️ Run the setup SQL first'); return; }
  const id=String(d.id??d.properties.name), name=d.properties.name;
  const ex=COUNTRIES.find(c=>String(c.country_id)===id && c.person===selectedPerson);
  try{
    if(ex){ await sbDelete('travel_countries',`id=eq.${ex.id}`); COUNTRIES=COUNTRIES.filter(c=>c.id!==ex.id); toast(`Removed ${name}`); }
    else{ const[row]=await sbInsert('travel_countries',{country_id:id,country_name:name,person:selectedPerson}); COUNTRIES.push(row);
      toast(`${PEOPLE[selectedPerson].name} → ${name}!`); confetti(ev.clientX,ev.clientY); }
    document.getElementById('c'+id)?.setAttribute('fill',landFill(id));
    drawAvatars(); renderLegend(); renderClist(); renderPeople();
  }catch(e){ toast('Save failed'); console.error(e); }
}
function renderLegend(){ const s=setOf('samir'),m=setOf('mina'); let both=0; s.forEach(id=>{ if(m.has(id))both++; });
  $('#cSamir').textContent=s.size; $('#cMina').textContent=m.size; $('#cBoth').textContent=both;
  $('#lSamir').textContent=PEOPLE.samir.name+' '+PEOPLE.samir.emoji; $('#lMina').textContent=PEOPLE.mina.name+' '+PEOPLE.mina.emoji; }
function renderClist(){ const box=$('#clist'); if(!COUNTRIES.length){ box.innerHTML=''; return; }
  const by={}; COUNTRIES.forEach(c=>{ const k=String(c.country_id); (by[k]=by[k]||{name:c.country_name,s:false,m:false}); if(c.person==='samir')by[k].s=true; if(c.person==='mina')by[k].m=true; });
  const items=Object.values(by).sort((a,b)=>a.name.localeCompare(b.name));
  box.innerHTML=`<h3>${items.length} countries and counting 🌎</h3><div class="chips">`+items.map(it=>{
    let mini=''; if(it.s)mini+=`<span>${avInner('samir')}</span>`; if(it.m)mini+=`<span>${avInner('mina')}</span>`;
    return `<span class="chip"><span class="mini">${mini}</span>${it.name}</span>`; }).join('')+`</div>`; }

/* ===== People pills ===== */
function renderPeople(){
  const box=$('#people'); const s=setOf('samir').size, m=setOf('mina').size;
  box.innerHTML=['samir','mina'].map(p=>{ const P=PEOPLE[p]; const on=selectedPerson===p?'on':'';
    return `<div class="pill ${on}" data-p="${p}"><div class="av">${avInner(p)}</div>
      <div class="meta"><div class="nm">${P.name}</div><div class="ct">${p==='samir'?s:m} countries</div></div>
      <div class="edit" data-edit="${p}">✏️</div></div>`; }).join('');
  box.querySelectorAll('.pill').forEach(el=>el.onclick=e=>{ if(e.target.closest('[data-edit]'))return; selectedPerson=el.dataset.p; renderPeople(); syncHint(); });
  box.querySelectorAll('[data-edit]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openAvatar(el.dataset.edit); });
}
function syncHint(){ const P=PEOPLE[selectedPerson]; const w=$('#hintWho'); w.textContent=P.name;
  w.style.background=selectedPerson==='samir'?'var(--samir-soft)':'var(--mina-soft)'; w.style.color=P.color; }

/* ===== Year views ===== */
function allYears(){ const ys=new Set(); const now=new Date().getFullYear(); for(let y=2026;y<=Math.max(2026,now);y++)ys.add(y); FLIGHTS.forEach(f=>ys.add(+f.year)); return [...ys].sort((a,b)=>a-b); }
function statsFor(p,y){ const fl=FLIGHTS.filter(f=>f.person===p&&+f.year===y); const km=fl.reduce((s,f)=>s+ +f.km,0);
  return { count:fl.length, km, longest:fl.reduce((mx,f)=>Math.max(mx,+f.km),0), list:fl.sort((a,b)=>(b.date||'').localeCompare(a.date||'')) }; }
function pcardHTML(p,y){ const st=statsFor(p,y),P=PEOPLE[p]; const rounds=st.km/EARTH_KM, moon=st.km/MOON_KM*100;
  const list=st.list.length?st.list.map(f=>`<div class="frow"><div><div class="route">${f.from_name||'?'}<span class="arw">→</span>${f.to_name||'?'}</div><div class="mt">${f.date||'—'}</div></div><div class="km">${nf(f.km)} km</div><button class="del" data-del="${f.id}">✕</button></div>`).join(''):`<div class="empty">No flights yet — add your first ✈️</div>`;
  return `<div class="pcard ${p}"><div class="ribbon"></div>
    <div class="phead"><div class="av">${avInner(p)}</div><div class="nm">${P.name}</div></div>
    <div class="stats">
      <div class="stat"><div class="v">${st.count}</div><div class="k">FLIGHTS ✈️</div></div>
      <div class="stat"><div class="v">${nf(st.km)}</div><div class="k">KILOMETERS 🛫</div></div>
      <div class="stat warm"><div class="v">${nf(st.longest)}</div><div class="k">LONGEST HOP 📏</div></div>
      <div class="stat warm"><div class="v">${rounds.toFixed(2)}×</div><div class="k">AROUND EARTH 🌍</div></div>
      <div class="stat wide"><div class="v">${moon.toFixed(1)}%</div><div class="k">OF THE WAY TO THE MOON 🌙</div><div class="bar"><i style="width:${Math.min(100,moon)}%"></i></div></div>
    </div>
    <div class="flights">${list}</div>
    <button class="addbtn" data-add="${p}" data-year="${y}">＋ Add ${P.name}'s flight</button></div>`; }
function yearHTML(y){ const s=statsFor('samir',y),m=statsFor('mina',y);
  return `<section class="view" id="view-${y}">${tablesMissing?setupBanner():''}
    <div class="yearhead"><div class="yr display">${y}</div><div class="tog">Together: <b>${nf(s.km+m.km)} km</b> · <b>${s.count+m.count}</b> flights</div></div>
    <div class="grid2">${pcardHTML('samir',y)}${pcardHTML('mina',y)}</div></section>`; }
function setupBanner(){ return `<div class="banner">⚙️ <b>One quick setup step.</b> The travel tables aren't in Supabase yet — paste <b>travel_setup.sql</b> into the Supabase SQL editor, run it, then reload. Saving is off until then.</div>`; }

/* ===== Tabs ===== */
function buildTabs(){
  const tabs=$('#tabs'), years=allYears();
  tabs.innerHTML=`<button class="tab active" data-view="map">🗺️ World Map</button>`+years.map(y=>`<button class="tab" data-view="${y}">${y}</button>`).join('');
  $('#yearViews').innerHTML=years.map(yearHTML).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); $(b.dataset.view==='map'?'#view-map':`#view-${b.dataset.view}`).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'}); });
  $('#yearViews').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openFlight(b.dataset.add,b.dataset.year));
  $('#yearViews').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delFlight(b.dataset.del));
}

/* ===== Flight modal ===== */
let flPerson='samir';
function openFlight(p,y){ if(tablesMissing){ toast('⚙️ Run the setup SQL first'); return; } flPerson=p;
  $('#whoSeg').innerHTML=['samir','mina'].map(x=>`<button data-p="${x}" class="${x===p?'on':''}">${PEOPLE[x].emoji} ${PEOPLE[x].name}</button>`).join('');
  $('#whoSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ flPerson=b.dataset.p; $('#whoSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.p===flPerson)); });
  $('#fDate').value=`${y}-06-15`; $('#fFrom').value=''; $('#fTo').value=''; $('#fKm').value=''; $('#kmHint').textContent='';
  $('#flightModal').classList.add('open'); }
function kmHint(){ const a=resolveAirport($('#fFrom').value),b=resolveAirport($('#fTo').value);
  if(a&&b){ $('#kmHint').textContent=`≈ ${nf(haversine(a,b))} km  (${a[0]} → ${b[0]})`; } else $('#kmHint').textContent=''; }
async function saveFlight(){ const from=$('#fFrom').value.trim(),to=$('#fTo').value.trim(); const a=resolveAirport(from),b=resolveAirport(to);
  let km=+$('#fKm').value; if(!km&&a&&b)km=haversine(a,b); const date=$('#fDate').value||'2026-01-01';
  if(!from||!to){ toast('Add from & to'); return; } if(!km){ toast('Enter distance (km)'); return; }
  const rec={person:flPerson,date,year:+date.slice(0,4),from_name:a?a[0]:from,to_name:b?b[0]:to,km:Math.round(km)};
  try{ const[row]=await sbInsert('travel_flights',rec); FLIGHTS.push(row); $('#flightModal').classList.remove('open'); buildTabs();
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    const t=[...document.querySelectorAll('.tab')].find(b=>b.dataset.view===String(rec.year)); if(t){ t.classList.add('active'); $(`#view-${rec.year}`).classList.add('active'); }
    toast(`✈️ ${nf(rec.km)} km added!`); }catch(e){ toast('Save failed'); console.error(e); } }
async function delFlight(id){ try{ await sbDelete('travel_flights',`id=eq.${id}`); FLIGHTS=FLIGHTS.filter(f=>String(f.id)!==String(id)); buildTabs(); toast('Removed'); }catch(e){ toast('Delete failed'); } }

/* ===== Avatar modal ===== */
let avPerson='samir', avDraft={emoji:null,photo:null};
const EMOJIS=['😎','🥰','😃','🤩','🧔','👩','🧑','👧','🦊','🐰','🐻','🐼','🐨','🦁','🐸','🐧','🦄','🌸','🌟','🚀','🏖️','🗺️'];
function openAvatar(p){ avPerson=p; const P=PEOPLE[p]; avDraft={emoji:P.emoji,photo:P.photo};
  $('#avTitle').textContent=`${P.name}'s sticker`; renderAvPrev();
  $('#emojiGrid').innerHTML=EMOJIS.map(e=>`<button data-e="${e}">${e}</button>`).join('');
  $('#emojiGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>{ avDraft.emoji=b.dataset.e; avDraft.photo=null; renderAvPrev(); });
  $('#avatarModal').classList.add('open'); }
function renderAvPrev(){ $('#avPrev').innerHTML=avDraft.photo?`<img src="${avDraft.photo}"/>`:avDraft.emoji; }
function pickPhoto(file){ const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(img.width,img.height),cv=document.createElement('canvas'); cv.width=cv.height=160; const cx=cv.getContext('2d'); cx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160); avDraft.photo=cv.toDataURL('image/jpeg',0.82); renderAvPrev(); }; img.src=rd.result; }; rd.readAsDataURL(file); }
async function saveAvatar(){ if(tablesMissing){ toast('⚙️ Run the setup SQL first'); return; }
  PEOPLE[avPerson].emoji=avDraft.emoji||PEOPLE[avPerson].emoji; PEOPLE[avPerson].photo=avDraft.photo;
  try{ await sbUpsert('travel_people',{person:avPerson,emoji:PEOPLE[avPerson].emoji,photo:PEOPLE[avPerson].photo,color:PEOPLE[avPerson].color},'person');
    $('#avatarModal').classList.remove('open'); repaint(); buildTabs(); toast('Sticker saved 🎉'); }
  catch(e){ toast('Save failed'); console.error(e); } }

/* ===== Wiring ===== */
function wire(){
  $('#fCancel').onclick=()=>$('#flightModal').classList.remove('open');
  $('#fSave').onclick=saveFlight;
  $('#flightModal').onclick=e=>{ if(e.target.id==='flightModal')$('#flightModal').classList.remove('open'); };
  $('#fFrom').oninput=kmHint; $('#fTo').oninput=kmHint;
  $('#airports').innerHTML=Object.entries(AIRPORTS).map(([c,[n]])=>`<option value="${n}">${c} · ${n}</option>`).join('');
  $('#avCancel').onclick=()=>$('#avatarModal').classList.remove('open');
  $('#avSave').onclick=saveAvatar;
  $('#avFile').onchange=e=>{ if(e.target.files[0])pickPhoto(e.target.files[0]); };
  $('#avatarModal').onclick=e=>{ if(e.target.id==='avatarModal')$('#avatarModal').classList.remove('open'); };
}

async function load(){
  try{
    const[cs,fs,ps]=await Promise.all([ sbGet('travel_countries','select=*'), sbGet('travel_flights','select=*'), sbGet('travel_people','select=*').catch(()=>[]) ]);
    COUNTRIES=cs; FLIGHTS=fs;
    ps.forEach(r=>{ if(PEOPLE[r.person]) PEOPLE[r.person]={...PEOPLE[r.person],emoji:r.emoji||PEOPLE[r.person].emoji,photo:r.photo||null,color:r.color||PEOPLE[r.person].color}; });
  }catch(e){ tablesMissing=true; $('#map-banner').innerHTML=setupBanner(); console.warn('tables missing:',e.message); }
  buildTabs(); wire(); renderPeople(); syncHint(); await initMap();
}
load();
</script>
