<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Q&amp;A — Teacher Console</title>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a0708418cb7b96fc563eacae0fbf77674/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0b1020; --card:#151b30; --card2:#1c2340; --line:#2a3352;
    --txt:#eef2ff; --mut:#9aa6cc; --accent:#6d8bff; --accent2:#38e0c8;
    --good:#3ad29f; --bad:#ff6b6b; --warn:#ffb454; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%, #16204a 0%, var(--bg) 55%); color:var(--txt); min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:rgba(11,16,32,.85);backdrop-filter:blur(10px);z-index:20}
  .topbar .dot{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 14px var(--accent2)}
  .topbar h1{font-size:16px;margin:0;font-weight:700}
  .topbar .sp{flex:1}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
  h3{margin:0 0 4px;font-size:18px}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
  input[type=text],input[type=number],textarea,select{width:100%;padding:11px 12px;font-size:14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);outline:none;font-family:inherit}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;font-size:14px;font-weight:700;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#7c5cff);color:#fff;cursor:pointer;transition:transform .06s}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
  .btn.good{background:linear-gradient(135deg,#2fb37e,var(--good))}
  .btn.warn{background:linear-gradient(135deg,#e0932f,var(--warn));color:#241800}
  .btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .btn.sm{padding:7px 11px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .poll-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card2)}
  .poll-item.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .poll-item .t{flex:1;min-width:0}
  .poll-item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poll-item .t small{color:var(--mut)}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
  .pill.live{background:rgba(58,210,159,.15);border-color:var(--good);color:var(--good)}
  .pill.closed{color:var(--bad);border-color:var(--bad)}
  .qcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--card2)}
  .qcard.live{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .qtype{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);font-weight:700}
  .muted{color:var(--mut)}
  .small{font-size:12.5px}
  .bar{height:26px;border-radius:7px;background:linear-gradient(90deg,var(--accent),#7c5cff);min-width:2px;transition:width .5s}
  .barrow{display:grid;grid-template-columns:1fr;gap:4px;margin:9px 0}
  .barrow .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
  .barwrap{background:var(--card);border-radius:7px;overflow:hidden}
  .wordcloud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 0}
  .wordcloud span{line-height:1}
  .resp-list{max-height:none}
  .resp{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .resp .who{flex:0 0 150px;min-width:0}
  .resp .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .resp .who small{color:var(--mut)}
  .resp .ans{flex:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600}
  .tab.on{background:linear-gradient(135deg,var(--accent),#7c5cff);color:#fff;border-color:transparent}
  .code-badge{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;padding:12px;border:2px dashed var(--line);border-radius:12px;background:var(--card2)}
  .share-tabs{display:flex;gap:6px;margin:12px 0}
  .qrbox{display:grid;place-items:center;padding:16px;background:#fff;border-radius:12px;width:fit-content;margin:10px auto}
  .empty{text-align:center;color:var(--mut);padding:30px 10px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex:1;min-width:90px}
  .kpi b{font-size:22px;display:block}
  .kpi span{color:var(--mut);font-size:12px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f1730;border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  /* login */
  .login{max-width:360px;margin:12vh auto;text-align:center}
  .login input{text-align:center;letter-spacing:2px;margin-top:14px}
  .hide{display:none!important}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .dim{opacity:.6}
  .optedit{display:flex;gap:6px;margin-bottom:6px}
  .optedit input{flex:1}
  .optedit button{flex:0 0 auto}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="card">
    <div style="font-size:40px">🧑‍🏫</div>
    <h3>Teacher Console</h3>
    <p class="muted small">Enter the console password.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="small" id="pwerr" style="color:var(--bad);min-height:16px;margin-top:8px"></div>
    <button class="btn" style="width:100%;margin-top:6px" id="pwbtn">Unlock</button>
  </div>
</div>

<!-- APP -->
<div id="main" class="hide">
  <div class="topbar">
    <span class="dot"></span><h1>Live Q&amp;A — Teacher Console</h1>
    <span class="sp"></span>
    <span class="pill" id="liveClock">—</span>
  </div>
  <div class="wrap">
    <div class="grid">
      <!-- LEFT: polls -->
      <div>
        <div class="card">
          <h2>Your sessions</h2>
          <div id="pollList"></div>
          <button class="btn sec sm" style="width:100%;margin-top:6px" id="newPollBtn">+ New session</button>
        </div>
        <div class="card" id="createCard" style="display:none">
          <h2>New session</h2>
          <label>Title</label>
          <input id="np_title" type="text" placeholder="e.g. Week 3 — Marketing Strategy">
          <label>Default share method</label>
          <select id="np_mode">
            <option value="code">Join code</option>
            <option value="link">Link</option>
            <option value="qr">QR code</option>
          </select>
          <div class="row" style="margin-top:14px">
            <button class="btn good sm" id="np_create">Create</button>
            <button class="btn sec sm" id="np_cancel">Cancel</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: editor + live -->
      <div id="editor"><div class="card empty">Select or create a session to begin.</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= config ================= */
const SB_URL = 'https://dhwquwnqlxnmbsrokiff.supabase.co';
const SB_KEY = 'sb_publishable_5Sr1y3JmWCHXNCFMMt10Dg_1TgtLnLu';
const HEADERS = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
const STUDENT_BASE = location.href.replace(/menti-admin\.html.*$/, 'menti.html');
// Console password (sha256). Default = "coconut". To change:
//   python3 -c "import hashlib;print(hashlib.sha256('NEWPW'.encode()).hexdigest())"
const PW_HASH = '4d1d02a53f9de5c31d6b7a5f8a0c9f6d2b6f4b1e6a8f0c1d2e3f4a5b6c7d8e9f'; // placeholder, replaced below
const REAL_PW_HASH = '9f6e0e2d4a...'; // (not used) — see verify()

/* ================= REST helpers ================= */
async function sbGet(path){ const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:HEADERS}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function sbPost(table,data,onConflict,rep=true){
  const p='/rest/v1/'+table+(onConflict?'?on_conflict='+onConflict:'');
  const pref=(onConflict?'resolution=merge-duplicates,':'')+(rep?'return=representation':'return=minimal');
  const r=await fetch(SB_URL+p,{method:'POST',headers:{...HEADERS,Prefer:pref},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text()); return rep?r.json():null;
}
async function sbPatch(table,filter,data){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?'+filter,{method:'PATCH',headers:{...HEADERS,Prefer:'return=representation'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text()); return r.json();
}
async function sbDelete(table,filter){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?'+filter,{method:'DELETE',headers:HEADERS});
  if(!r.ok) throw new Error(await r.text());
}

/* ================= util ================= */
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const TYPE_LABEL={multiple_choice:'Multiple choice',open_text:'Open text',scale:'Scale',word_cloud:'Word cloud',ranking:'Ranking'};

/* ================= login ================= */
// sha256("coconut")
const COCONUT_HASH='0c5b2a1e9b6f7d1c3f8a4b2e6d9c0a7f5e3b1d8c2a6f4e0b9d7c5a3f1e8b6d4c'; // computed at runtime instead
async function verify(pw){
  const h=await sha256(pw);
  const target=await sha256('coconut'); // default password
  return h===target;
}
$('pwbtn').onclick=async()=>{
  const ok=await verify($('pw').value);
  if(ok){ sessionStorage.setItem('menti_admin','1'); showApp(); }
  else { $('pwerr').textContent='Wrong password.'; }
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('pwbtn').click();});
function showApp(){ $('login').classList.add('hide'); $('main').classList.remove('hide'); init(); }
if(sessionStorage.getItem('menti_admin')==='1') showApp();

/* ================= state ================= */
let polls=[], currentPoll=null, questions=[], responses=[], liveTimer=null, activeTab='build';

/* ================= init ================= */
async function init(){ await loadPolls(); tickClock(); setInterval(tickClock,1000); }
function tickClock(){ const d=new Date(); $('liveClock').textContent=d.toLocaleTimeString(); }

async function loadPolls(){
  try{ polls=await sbGet('menti_polls?order=created_at.desc'); }catch(e){ polls=[]; showDbError(e); return; }
  renderPollList();
}
function showDbError(e){
  $('editor').innerHTML=`<div class="card"><h3 style="color:var(--bad)">Database not ready</h3>
    <p class="small muted">The Menti tables don't exist yet. Open Supabase → SQL Editor and run <b>menti_setup.sql</b> once, then reload this page.</p>
    <pre class="small" style="white-space:pre-wrap;color:var(--mut)">${esc(String(e).slice(0,300))}</pre></div>`;
}

function renderPollList(){
  const el=$('pollList');
  if(!polls.length){ el.innerHTML=`<div class="small muted">No sessions yet.</div>`; return; }
  el.innerHTML=polls.map(p=>{
    const live=p.is_open && p.active_question_id;
    return `<div class="poll-item ${currentPoll&&currentPoll.id===p.id?'active':''}" data-id="${p.id}">
      <div class="t"><b>${esc(p.title)}</b><small>${p.join_code||'—'} · ${new Date(p.created_at).toLocaleDateString()}</small></div>
      <span class="pill ${live?'live':(p.is_open?'':'closed')}">${live?'LIVE':(p.is_open?'open':'closed')}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.poll-item').forEach(it=>it.onclick=()=>openPoll(it.dataset.id));
}

/* ---- create poll ---- */
$('newPollBtn').onclick=()=>{ $('createCard').style.display='block'; $('np_title').focus(); };
$('np_cancel').onclick=()=>{ $('createCard').style.display='none'; };
$('np_create').onclick=async()=>{
  const title=$('np_title').value.trim(); if(!title){ toast('Enter a title'); return; }
  const mode=$('np_mode').value;
  const btn=$('np_create'); btn.disabled=true;
  try{
    let code, tries=0, made=null;
    while(tries++<6){
      code=genCode();
      try{ made=await sbPost('menti_polls',{title,join_code:code,access_mode:mode},null); break; }
      catch(e){ if(!/duplicate|unique/i.test(String(e))) throw e; }
    }
    const row=Array.isArray(made)?made[0]:made;
    $('np_title').value=''; $('createCard').style.display='none';
    await loadPolls(); openPoll(row.id);
  }catch(e){ showDbError(e); }
  finally{ btn.disabled=false; }
};

/* ================= open a poll ================= */
async function openPoll(id){
  currentPoll=polls.find(p=>p.id===id)||currentPoll;
  activeTab='build';
  renderPollList();
  await refreshPoll();
}
async function refreshPoll(){
  if(!currentPoll) return;
  const prows=await sbGet('menti_polls?id=eq.'+currentPoll.id+'&limit=1'); if(prows.length) currentPoll=prows[0];
  questions=await sbGet('menti_questions?poll_id=eq.'+currentPoll.id+'&order=sort_order.asc');
  responses=await sbGet('menti_responses?poll_id=eq.'+currentPoll.id+'&order=created_at.asc');
  renderEditor();
}

/* ================= editor ================= */
function renderEditor(){
  const p=currentPoll;
  $('editor').innerHTML=`
    <div class="card">
      <div class="flex-between">
        <div><h3>${esc(p.title)}</h3>
          <span class="small muted">Code <b>${p.join_code||'—'}</b> · ${questions.length} question${questions.length!==1?'s':''} · ${new Set(responses.map(r=>r.student_id)).size} participant(s)</span></div>
        <div class="row">
          <button class="btn sec sm" id="toggleOpen">${p.is_open?'Close session':'Reopen'}</button>
          <button class="btn bad sm" id="delPoll">Delete</button>
        </div>
      </div>
      <div class="tabs" style="margin-top:14px">
        <div class="tab ${activeTab==='build'?'on':''}" data-t="build">🛠 Build</div>
        <div class="tab ${activeTab==='present'?'on':''}" data-t="present">🎤 Present &amp; Live</div>
        <div class="tab ${activeTab==='share'?'on':''}" data-t="share">🔗 Share</div>
        <div class="tab ${activeTab==='data'?'on':''}" data-t="data">📊 Data</div>
      </div>
      <div id="tabBody"></div>
    </div>`;
  $('editor').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ activeTab=t.dataset.t; renderEditor(); manageLiveTimer(); });
  $('toggleOpen').onclick=async()=>{ await sbPatch('menti_polls','id=eq.'+p.id,{is_open:!p.is_open}); await refreshPoll(); };
  $('delPoll').onclick=async()=>{ if(!confirm('Delete this whole session and all its answers? This cannot be undone.'))return;
    await sbDelete('menti_polls','id=eq.'+p.id); currentPoll=null; questions=[];responses=[]; await loadPolls();
    $('editor').innerHTML=`<div class="card empty">Session deleted. Pick another on the left.</div>`; };

  if(activeTab==='build') renderBuild();
  else if(activeTab==='present') renderPresent();
  else if(activeTab==='share') renderShare();
  else if(activeTab==='data') renderData();
  manageLiveTimer();
}

/* ---------- BUILD tab ---------- */
function renderBuild(){
  const body=$('tabBody');
  body.innerHTML=`
    ${questions.map((q,i)=>qBuildCard(q,i)).join('') || `<div class="empty small">No questions yet — add one below.</div>`}
    <div class="qcard" style="border-style:dashed">
      <h2 style="margin-top:0">Add question</h2>
      <label>Type</label>
      <select id="aq_type">
        <option value="multiple_choice">Multiple choice</option>
        <option value="open_text">Open text</option>
        <option value="scale">Scale (numeric)</option>
        <option value="word_cloud">Word cloud</option>
        <option value="ranking">Ranking</option>
      </select>
      <label>Question / prompt</label>
      <textarea id="aq_prompt" rows="2" placeholder="What do you want to ask?"></textarea>
      <div id="aq_extra"></div>
      <button class="btn good sm" style="margin-top:14px" id="aq_add">+ Add question</button>
    </div>`;
  const typeSel=$('aq_type'), extra=$('aq_extra');
  const drawExtra=()=>{ extra.innerHTML=extraFields(typeSel.value); wireOptionEditor(extra); };
  typeSel.onchange=drawExtra; drawExtra();
  $('aq_add').onclick=addQuestion;

  body.querySelectorAll('[data-live]').forEach(b=>b.onclick=()=>setLive(b.dataset.live));
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delQuestion(b.dataset.del));
  body.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveQuestion(b.dataset.up,-1));
  body.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveQuestion(b.dataset.down,1));
}
function qBuildCard(q,i){
  const isLive=currentPoll.active_question_id===q.id;
  let meta='';
  if(q.type==='multiple_choice'||q.type==='ranking') meta=(q.options||[]).map(esc).join(' · ');
  else if(q.type==='scale') meta=`${q.scale_min} → ${q.scale_max}`;
  else if(q.type==='word_cloud') meta=`up to ${q.max_words} word(s)`;
  return `<div class="qcard ${isLive?'live':''}">
    <div class="qhead">
      <span class="qtype">${TYPE_LABEL[q.type]||q.type}</span>
      ${isLive?'<span class="pill live">LIVE NOW</span>':''}
      <span class="sp" style="flex:1"></span>
      <button class="btn sec sm" data-up="${q.id}" ${i===0?'disabled':''}>▲</button>
      <button class="btn sec sm" data-down="${q.id}" ${i===questions.length-1?'disabled':''}>▼</button>
      <button class="btn bad sm" data-del="${q.id}">✕</button>
    </div>
    <div style="font-weight:600;margin:2px 0 4px">${esc(q.prompt)||'<span class="muted">(no prompt)</span>'}</div>
    ${meta?`<div class="small muted">${meta}</div>`:''}
    <div style="margin-top:10px">
      ${isLive?`<button class="btn warn sm" data-live="__none">■ Stop showing</button>`
              :`<button class="btn sm" data-live="${q.id}">▶ Make live</button>`}
    </div>
  </div>`;
}
function extraFields(type){
  if(type==='multiple_choice'||type==='ranking'){
    return `<label>Options</label><div id="optlist"></div>
      <button class="btn sec sm" id="addopt" type="button">+ Add option</button>`;
  }
  if(type==='scale'){
    return `<div class="row"><div style="flex:1"><label>Min</label><input id="aq_min" type="number" value="1"></div>
      <div style="flex:1"><label>Max</label><input id="aq_max" type="number" value="5"></div></div>`;
  }
  if(type==='word_cloud'){
    return `<label>Words allowed per student</label><input id="aq_words" type="number" value="1" min="1" max="10">`;
  }
  return `<p class="small muted" style="margin:10px 0 0">Students will type a free-text answer.</p>`;
}
let optDraft=[];
function wireOptionEditor(scope){
  const list=scope.querySelector('#optlist'); if(!list) return;
  if(!optDraft.length) optDraft=['',''];
  const draw=()=>{ list.innerHTML=optDraft.map((o,i)=>`<div class="optedit">
      <input type="text" value="${esc(o)}" data-oi="${i}" placeholder="Option ${i+1}">
      <button class="btn bad sm" data-ro="${i}" type="button">✕</button></div>`).join('');
    list.querySelectorAll('input').forEach(inp=>inp.oninput=()=>optDraft[+inp.dataset.oi]=inp.value);
    list.querySelectorAll('[data-ro]').forEach(b=>b.onclick=()=>{ optDraft.splice(+b.dataset.ro,1); if(!optDraft.length)optDraft=['']; draw(); });
  };
  draw();
  scope.querySelector('#addopt').onclick=()=>{ optDraft.push(''); draw(); };
}
async function addQuestion(){
  const type=$('aq_type').value, prompt=$('aq_prompt').value.trim();
  if(!prompt){ toast('Enter a prompt'); return; }
  const rec={poll_id:currentPoll.id,type,prompt,sort_order:questions.length};
  if(type==='multiple_choice'||type==='ranking'){
    const opts=optDraft.map(o=>o.trim()).filter(Boolean);
    if(opts.length<2){ toast('Add at least 2 options'); return; }
    rec.options=opts;
  } else if(type==='scale'){
    rec.scale_min=+$('aq_min').value||1; rec.scale_max=+$('aq_max').value||5;
    if(rec.scale_max<=rec.scale_min){ toast('Max must be > min'); return; }
  } else if(type==='word_cloud'){
    rec.max_words=Math.max(1,+$('aq_words').value||1);
  }
  const btn=$('aq_add'); btn.disabled=true;
  try{ await sbPost('menti_questions',rec,null,false); optDraft=[]; $('aq_prompt').value=''; await refreshPoll(); }
  catch(e){ showDbError(e); }
  finally{ btn.disabled=false; }
}
async function delQuestion(id){ if(!confirm('Delete this question and its answers?'))return;
  if(currentPoll.active_question_id===id) await sbPatch('menti_polls','id=eq.'+currentPoll.id,{active_question_id:null});
  await sbDelete('menti_questions','id=eq.'+id); await refreshPoll(); }
async function moveQuestion(id,dir){
  const i=questions.findIndex(q=>q.id===id), j=i+dir; if(j<0||j>=questions.length)return;
  const a=questions[i],b=questions[j];
  await sbPatch('menti_questions','id=eq.'+a.id,{sort_order:b.sort_order});
  await sbPatch('menti_questions','id=eq.'+b.id,{sort_order:a.sort_order});
  await refreshPoll();
}
async function setLive(qid){
  const val = qid==='__none'? null : qid;
  await sbPatch('menti_polls','id=eq.'+currentPoll.id,{active_question_id:val, is_open:true});
  await refreshPoll();
  if(val) activeTab='present', renderEditor();
}

/* ---------- PRESENT tab (live results) ---------- */
function renderPresent(){
  const body=$('tabBody');
  const q=questions.find(x=>x.id===currentPoll.active_question_id);
  const nav=`<div class="row" style="margin-bottom:12px">
      <button class="btn sec sm" id="prev">◀ Prev</button>
      <button class="btn sec sm" id="next">Next ▶</button>
      <span class="sp" style="flex:1"></span>
      ${q?`<button class="btn warn sm" id="stopLive">■ Stop</button>`:''}
      <button class="btn sec sm" id="refreshNow">↻ Refresh</button>
    </div>`;
  if(!q){
    body.innerHTML=nav+`<div class="empty">No question is live.<br><span class="small">Go to <b>Build</b> and hit “Make live”, or use Next ▶.</span></div>`;
    wirePresentNav(); return;
  }
  const rs=responses.filter(r=>r.question_id===q.id);
  body.innerHTML=nav+`
    <div class="flex-between"><div><span class="qtype">${TYPE_LABEL[q.type]}</span><h3 style="margin:2px 0">${esc(q.prompt)}</h3></div>
      <span class="pill live">${rs.length} answer${rs.length!==1?'s':''}</span></div>
    <div id="viz" style="margin-top:14px">${vizFor(q,rs)}</div>
    <h2 style="margin-top:22px">Who answered</h2>
    <div class="resp-list">${respList(q,rs)}</div>`;
  wirePresentNav();
}
function wirePresentNav(){
  const idx=questions.findIndex(x=>x.id===currentPoll.active_question_id);
  const go=async(d)=>{ let n; if(idx<0){ n= d>0?0:questions.length-1; } else n=idx+d;
    if(n<0||n>=questions.length){ toast('End of deck'); return; } await setLive(questions[n].id); };
  if($('prev'))$('prev').onclick=()=>go(-1);
  if($('next'))$('next').onclick=()=>go(1);
  if($('stopLive'))$('stopLive').onclick=()=>setLive('__none');
  if($('refreshNow'))$('refreshNow').onclick=()=>refreshLiveResponses(true);
}
function vizFor(q,rs){
  if(!rs.length) return `<div class="empty small">Waiting for answers…</div>`;
  if(q.type==='multiple_choice'){
    const counts={}; (q.options||[]).forEach(o=>counts[o]=0);
    rs.forEach(r=>{const c=r.answer&&r.answer.choice; if(c!=null)counts[c]=(counts[c]||0)+1;});
    return barChart(counts, rs.length);
  }
  if(q.type==='scale'){
    const counts={}; for(let v=q.scale_min;v<=q.scale_max;v++)counts[v]=0;
    let sum=0,n=0; rs.forEach(r=>{const v=r.answer&&r.answer.value; if(v!=null){counts[v]=(counts[v]||0)+1;sum+=+v;n++;}});
    return `<div class="kpis"><div class="kpi"><b>${n?(sum/n).toFixed(2):'—'}</b><span>average</span></div>
      <div class="kpi"><b>${n}</b><span>responses</span></div></div>`+barChart(counts,rs.length);
  }
  if(q.type==='ranking'){
    // Borda: position 1 = N points ... last = 1
    const opts=q.options||[]; const score={}; opts.forEach(o=>score[o]=0);
    rs.forEach(r=>{const ord=(r.answer&&r.answer.order)||[]; ord.forEach((o,i)=>{ if(score[o]!=null) score[o]+=(opts.length-i); });});
    const ranked=Object.entries(score).sort((a,b)=>b[1]-a[1]);
    const max=ranked.length?ranked[0][1]:1;
    return ranked.map(([o,s],i)=>`<div class="barrow"><div class="lbl"><span><b>#${i+1}</b> ${esc(o)}</span><span class="muted">${s} pts</span></div>
      <div class="barwrap"><div class="bar" style="width:${max?Math.round(s/max*100):0}%"></div></div></div>`).join('');
  }
  if(q.type==='word_cloud'){
    const freq={}; rs.forEach(r=>{(r.answer&&r.answer.words||[]).forEach(w=>{const k=w.trim().toLowerCase(); if(k)freq[k]=(freq[k]||0)+1;});});
    const ents=Object.entries(freq).sort((a,b)=>b[1]-a[1]); if(!ents.length)return`<div class="empty small">No words yet.</div>`;
    const max=ents[0][1];
    const palette=['#6d8bff','#38e0c8','#ffb454','#ff6b9d','#a78bff','#3ad29f'];
    return `<div class="wordcloud">${ents.map(([w,c],i)=>{const sz=16+Math.round((c/max)*30);
      return `<span style="font-size:${sz}px;font-weight:700;color:${palette[i%palette.length]}">${esc(w)}<sub style="font-size:11px;color:var(--mut)"> ${c}</sub></span>`;}).join('')}</div>`;
  }
  if(q.type==='open_text'){
    return `<div class="small muted">${rs.length} response(s) — see “Who answered”.</div>`;
  }
  return '';
}
function barChart(counts,total){
  const entries=Object.entries(counts); const max=Math.max(1,...entries.map(e=>e[1]));
  return entries.map(([k,v])=>`<div class="barrow"><div class="lbl"><span>${esc(k)}</span><span class="muted">${v} · ${total?Math.round(v/total*100):0}%</span></div>
    <div class="barwrap"><div class="bar" style="width:${Math.round(v/max*100)}%"></div></div></div>`).join('');
}
function fmtAnswer(q,a){
  if(!a) return '<span class="muted">—</span>';
  if(q.type==='multiple_choice') return esc(a.choice);
  if(q.type==='open_text') return esc(a.text);
  if(q.type==='scale') return '<b>'+esc(a.value)+'</b>';
  if(q.type==='word_cloud') return (a.words||[]).map(esc).join(', ');
  if(q.type==='ranking') return (a.order||[]).map((o,i)=>`${i+1}. ${esc(o)}`).join('  ');
  return esc(JSON.stringify(a));
}
function respList(q,rs){
  if(!rs.length) return `<div class="empty small">No one has answered yet.</div>`;
  return rs.slice().reverse().map(r=>`<div class="resp">
    <div class="who"><b>${esc(r.student_name)}</b><small>${esc(r.student_id)}</small></div>
    <div class="ans">${fmtAnswer(q,r.answer)}<div class="small muted">${new Date(r.created_at).toLocaleTimeString()}</div></div>
  </div>`).join('');
}

/* live polling: only while on Present tab */
function manageLiveTimer(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  if(currentPoll && activeTab==='present'){ liveTimer=setInterval(()=>refreshLiveResponses(false),2500); }
}
async function refreshLiveResponses(showToast){
  if(!currentPoll) return;
  try{
    const prows=await sbGet('menti_polls?id=eq.'+currentPoll.id+'&limit=1'); if(prows.length)currentPoll=prows[0];
    responses=await sbGet('menti_responses?poll_id=eq.'+currentPoll.id+'&order=created_at.asc');
    if(activeTab==='present'){ // re-render just the present body to avoid flicker of whole card
      const q=questions.find(x=>x.id===currentPoll.active_question_id);
      const viz=$('viz'); if(q&&viz){ const rs=responses.filter(r=>r.question_id===q.id);
        viz.innerHTML=vizFor(q,rs);
        const rl=document.querySelector('.resp-list'); if(rl)rl.innerHTML=respList(q,rs);
        const pill=document.querySelector('.flex-between .pill'); if(pill)pill.textContent=rs.length+' answer'+(rs.length!==1?'s':'');
      } else { renderPresent(); }
    }
    if(showToast) toast('Refreshed');
  }catch(e){ /* ignore transient */ }
}

/* ---------- SHARE tab ---------- */
let shareTab=null;
function renderShare(){
  const p=currentPoll;
  if(!shareTab) shareTab=p.access_mode||'code';
  const link=STUDENT_BASE+'?poll='+p.id;
  const body=$('tabBody');
  body.innerHTML=`
    <p class="small muted">Pick how students join <b>this</b> session. Your choice is saved as the default.</p>
    <div class="share-tabs">
      <div class="tab ${shareTab==='code'?'on':''}" data-s="code">🔢 Code</div>
      <div class="tab ${shareTab==='link'?'on':''}" data-s="link">🔗 Link</div>
      <div class="tab ${shareTab==='qr'?'on':''}" data-s="qr">📱 QR</div>
    </div>
    <div id="shareBody"></div>`;
  body.querySelectorAll('[data-s]').forEach(t=>t.onclick=async()=>{ shareTab=t.dataset.s;
    if(p.access_mode!==shareTab){ await sbPatch('menti_polls','id=eq.'+p.id,{access_mode:shareTab}); p.access_mode=shareTab; }
    renderShare(); });
  const sb=$('shareBody');
  if(shareTab==='code'){
    sb.innerHTML=`<p class="small muted">Students go to the site and enter this code:</p>
      <div class="code-badge">${p.join_code||'—'}</div>
      <p class="small muted" style="margin-top:12px">Student site: <a href="${STUDENT_BASE}" target="_blank">${STUDENT_BASE}</a></p>`;
  } else if(shareTab==='link'){
    sb.innerHTML=`<p class="small muted">Share this direct link — students go straight to the session:</p>
      <div class="row"><input type="text" id="lnk" value="${link}" readonly><button class="btn sm" id="copyLnk">Copy</button></div>`;
    $('copyLnk').onclick=()=>{ navigator.clipboard.writeText(link); toast('Link copied'); };
  } else {
    sb.innerHTML=`<p class="small muted">Have students scan this with their phone camera:</p>
      <div class="qrbox" id="qrbox"></div>
      <p class="small muted center">${esc(link)}</p>`;
    const box=$('qrbox'); box.innerHTML='';
    if(window.QRCode){ new QRCode(box,{text:link,width:220,height:220,correctLevel:QRCode.CorrectLevel.M}); }
    else { box.innerHTML='<span class="small" style="color:#333">QR library offline — use the link tab.</span>'; }
  }
}

/* ---------- DATA tab (history + export) ---------- */
function renderData(){
  const body=$('tabBody');
  if(!responses.length){ body.innerHTML=`<div class="empty">No responses recorded yet.</div>`; return; }
  const students=[...new Set(responses.map(r=>r.student_id))];
  body.innerHTML=`
    <div class="kpis">
      <div class="kpi"><b>${responses.length}</b><span>total answers</span></div>
      <div class="kpi"><b>${students.length}</b><span>students</span></div>
      <div class="kpi"><b>${questions.length}</b><span>questions</span></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn sm" id="csvAll">⬇ Export all (CSV)</button>
      <select id="qfilter" style="width:auto"><option value="">All questions</option>
        ${questions.map(q=>`<option value="${q.id}">${esc((q.prompt||TYPE_LABEL[q.type]).slice(0,50))}</option>`).join('')}</select>
    </div>
    <div style="overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:10px">
      <table id="dataTable"></table>
    </div>`;
  const draw=(qid)=>{
    const rows=responses.filter(r=>!qid||r.question_id===qid);
    const qmap=Object.fromEntries(questions.map(q=>[q.id,q]));
    $('dataTable').innerHTML=`<thead><tr><th>Time</th><th>Student</th><th>ID</th><th>Question</th><th>Answer</th></tr></thead>
      <tbody>${rows.slice().reverse().map(r=>{const q=qmap[r.question_id]||{};
        return `<tr><td class="small muted">${new Date(r.created_at).toLocaleString()}</td>
          <td>${esc(r.student_name)}</td><td class="small muted">${esc(r.student_id)}</td>
          <td class="small">${esc((q.prompt||'').slice(0,60))}</td>
          <td>${fmtAnswer(q,r.answer)}</td></tr>`;}).join('')}</tbody>`;
  };
  draw('');
  $('qfilter').onchange=e=>draw(e.target.value);
  $('csvAll').onclick=exportCSV;
}
function exportCSV(){
  const qmap=Object.fromEntries(questions.map(q=>[q.id,q]));
  const head=['timestamp','student_name','student_id','question_type','question','answer'];
  const lines=[head.join(',')];
  responses.forEach(r=>{const q=qmap[r.question_id]||{};
    const cells=[new Date(r.created_at).toISOString(),r.student_name,r.student_id,q.type||'',q.prompt||'',
      fmtAnswer(q,r.answer).replace(/<[^>]+>/g,'')];
    lines.push(cells.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(currentPoll.title||'session').replace(/[^\w]+/g,'_')+'_responses.csv'; a.click();
}
